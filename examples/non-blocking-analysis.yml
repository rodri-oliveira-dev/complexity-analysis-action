name: Non-blocking complexity analysis

on:
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      # Replace the zero SHA with the reviewed release commit.
      - uses: rodri-oliveira-dev/complexity-analysis-action@0000000000000000000000000000000000000000
        with:
          path: MySolution.slnx
          max-cyclomatic-complexity: "15"
          fail-on-quality-gate: "false"
