name: Complexity Analysis

on:
  pull_request:

jobs:
  complexity-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required only when upload-sarif is true.
      security-events: write
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Pinned to the reviewed v1.0.0 release commit.
      - uses: rodri-oliveira-dev/complexity-analysis-action@2d807ef29ca03c685d224543a135d8c30dfe2c67
        with:
          path: MySolution.slnx
          tool-version: 1.0.1
          output-directory: artifacts/complexity-analysis
          include-generated: "false"
          detect-duplicates: "false"
          max-complexity: n_log_n
          max-cyclomatic-complexity: "15"
          max-cognitive-complexity: "20"
          max-nesting-depth: "4"
          max-method-nloc: "80"
          max-duplicate-rate: "5"
          fail-on-quality-gate: "true"
          compare-with-base: "true"
          fail-on-regression: "true"
          upload-sarif: "true"
