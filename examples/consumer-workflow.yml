name: Complexity Analysis

on:
  pull_request:

jobs:
  complexity-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required only when upload-sarif is true.
      security-events: write
    steps:
      - uses: actions/checkout@v6

      # Future release reference: v1 does not exist until the first release.
      - uses: rodri-oliveira-dev/complexity-analysis-action@v1
        with:
          path: MySolution.slnx
          tool-version: 1.0.0
          output-directory: artifacts/complexity-analysis
          include-generated: "false"
          detect-duplicates: "false"
          max-complexity: n_log_n
          max-cyclomatic-complexity: "15"
          max-cognitive-complexity: "20"
          max-nesting-depth: "4"
          max-method-nloc: "80"
          max-duplicate-rate: "5"
          fail-on-quality-gate: "true"
          upload-sarif: "true"
