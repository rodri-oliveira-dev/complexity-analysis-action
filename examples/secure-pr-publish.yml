name: Publish complexity PR report

on:
  workflow_run:
    workflows: [Complexity PR analysis]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0] != null }}
    runs-on: ubuntu-latest
    concurrency:
      group: complexity-pr-report-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: true
    steps:
      # Download only the named artifact from the exact triggering run.
      # actions/download-artifact v6.0.0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: complexity-pr-report
          path: downloaded-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # Replace with the same reviewed full commit SHA as the analysis workflow.
      - uses: rodri-oliveira-dev/complexity-analysis-action/publish-pr-report@0000000000000000000000000000000000000000
        with:
          report-path: downloaded-report/pr-report.json
          expected-repository: ${{ github.repository }}
          expected-head-sha: ${{ github.event.workflow_run.head_sha }}
          expected-base-sha: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          expected-pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          expected-run-id: ${{ github.event.workflow_run.id }}
          expected-workflow-name: ${{ github.event.workflow_run.name }}
