name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run pinned static validation
        shell: bash
        run: bash scripts/static-checks.sh

  script-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test validation, execution, failures, outputs, and cancellation
        shell: bash
        run: bash tests/integration/test-action-scripts.sh
      - name: Test baseline resolution and comparison orchestration
        shell: bash
        run: bash tests/integration/test-comparison-scripts.sh
      - name: Test structured PR reporting integration
        shell: bash
        run: bash tests/integration/test-pr-reporting-scripts.sh
