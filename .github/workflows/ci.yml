name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  action-smoke-test:
    name: Analyze ${{ matrix.entry-kind }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - entry-kind: csproj
            entry-path: tests/fixtures/Sample Project/Sample Project.csproj
          - entry-kind: sln
            entry-path: tests/fixtures/Sample Project/Sample Project.sln
          - entry-kind: slnx
            entry-path: tests/fixtures/Sample Project/Sample Project.slnx

    steps:
      - uses: actions/checkout@v6

      - name: Run local Action
        id: complexity
        uses: ./
        with:
          path: ${{ matrix.entry-path }}
          tool-version: 1.0.0
          output-directory: artifacts/${{ matrix.entry-kind }} report
          include-generated: "false"
          detect-duplicates: "true"

      - name: Verify outputs
        shell: bash
        env:
          REPORT_PATH: ${{ steps.complexity.outputs.report-path }}
          SARIF_PATH: ${{ steps.complexity.outputs.sarif-path }}
          ANALYSIS_STATUS: ${{ steps.complexity.outputs.analysis-status }}
          QUALITY_GATE_STATUS: ${{ steps.complexity.outputs.quality-gate-status }}
          TOOL_VERSION: ${{ steps.complexity.outputs.tool-version }}
        run: |
          test -s "$REPORT_PATH"
          test -s "$SARIF_PATH"
          test "$ANALYSIS_STATUS" = "success"
          test "$QUALITY_GATE_STATUS" = "not-configured"
          test "$TOOL_VERSION" = "1.0.0"
          python3 scripts/validate-report.py json "$REPORT_PATH"
          python3 scripts/validate-report.py sarif "$SARIF_PATH"

  quality-gate-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run all supported quality gates
        id: passing-gates
        uses: ./
        with:
          path: tests/fixtures/Sample Project/Sample Project.slnx
          tool-version: 1.0.0
          output-directory: artifacts/passing-gates
          max-complexity: factorial
          max-cyclomatic-complexity: "100"
          max-cognitive-complexity: "100"
          max-nesting-depth: "100"
          max-method-nloc: "1000"
          max-duplicate-rate: "100"

      - name: Verify passing quality gates
        shell: bash
        env:
          QUALITY_GATE_STATUS: ${{ steps.passing-gates.outputs.quality-gate-status }}
        run: test "$QUALITY_GATE_STATUS" = "passed"

      - name: Run non-blocking failed quality gate
        id: non-blocking-gate
        uses: ./
        with:
          path: tests/fixtures/Sample Project/Sample Project.csproj
          tool-version: 1.0.0
          output-directory: artifacts/non-blocking-gate
          max-cyclomatic-complexity: "1"
          fail-on-quality-gate: "false"

      - name: Verify non-blocking quality gate
        shell: bash
        env:
          REPORT_PATH: ${{ steps.non-blocking-gate.outputs.report-path }}
          SARIF_PATH: ${{ steps.non-blocking-gate.outputs.sarif-path }}
          ANALYSIS_STATUS: ${{ steps.non-blocking-gate.outputs.analysis-status }}
          QUALITY_GATE_STATUS: ${{ steps.non-blocking-gate.outputs.quality-gate-status }}
        run: |
          test -s "$REPORT_PATH"
          test -s "$SARIF_PATH"
          test "$ANALYSIS_STATUS" = "success"
          test "$QUALITY_GATE_STATUS" = "failed"

      - name: Run blocking failed quality gate
        id: blocking-gate
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/Sample Project/Sample Project.csproj
          tool-version: 1.0.0
          output-directory: artifacts/blocking-gate
          max-cyclomatic-complexity: "1"

      - name: Verify blocking quality gate and retained reports
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.blocking-gate.outcome }}
          REPORT_PATH: ${{ steps.blocking-gate.outputs.report-path }}
          SARIF_PATH: ${{ steps.blocking-gate.outputs.sarif-path }}
          QUALITY_GATE_STATUS: ${{ steps.blocking-gate.outputs.quality-gate-status }}
        run: |
          test "$STEP_OUTCOME" = "failure"
          test -s "$REPORT_PATH"
          test -s "$SARIF_PATH"
          test "$QUALITY_GATE_STATUS" = "failed"

  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Bash syntax
        shell: bash
        run: bash -n scripts/*.sh
      - name: Validate Python syntax
        run: python3 -m compileall -q scripts
      - name: Run ShellCheck
        shell: bash
        run: shellcheck scripts/*.sh
      - name: Run actionlint
        shell: bash
        run: |
          version=1.7.7
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/$archive" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
