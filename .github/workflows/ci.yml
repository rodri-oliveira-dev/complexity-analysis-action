name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Run pinned static validation
        shell: bash
        run: bash scripts/static-checks.sh

  script-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Test validation, execution, failures, outputs, and cancellation
        shell: bash
        run: bash tests/integration/test-action-scripts.sh
      - name: Test baseline resolution and comparison orchestration
        shell: bash
        run: bash tests/integration/test-comparison-scripts.sh
