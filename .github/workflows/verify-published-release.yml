name: Verify published Action release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published stable Action version (for example v1.0.0)
        required: true
        type: string
      commit:
        description: Approved full release commit SHA
        required: true
        type: string
      verify_major:
        description: Verify the corresponding maintained major tag points to the same commit
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify published release and exact Git ref targets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          VERIFY_MAJOR: ${{ inputs.verify_major }}
        run: |
          flags=()
          if [[ "$VERIFY_MAJOR" == "true" ]]; then flags+=(--verify-major); fi
          python3 scripts/verify-publication.py \
            --repository "$RELEASE_REPOSITORY" \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --output publication-verification.json "${flags[@]}"
      - name: Preserve verification report
        if: ${{ always() && hashFiles('publication-verification.json') != '' }}
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: publication-verification
          path: publication-verification.json
          retention-days: 30
          if-no-files-found: error
