name: Release readiness

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable Action version (for example v1.0.0)
        required: true
        type: string
      immutable_releases_enabled:
        description: Confirm immutable releases are enabled in repository settings
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: release-readiness-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require release readiness from main
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
            echo "::error title=Invalid release source::Start Release readiness from the main branch."
            exit 1
          fi
          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid release SHA::Expected a complete 40-character commit SHA."
            exit 1
          fi
          echo "Preparing $RELEASE_VERSION from main commit $RELEASE_COMMIT"
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up .NET 10
        # setup-dotnet v6.0.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.403
      - name: Run static, unit, and integration validation
        shell: bash
        run: |
          bash scripts/static-checks.sh
          bash tests/integration/test-action-scripts.sh
          bash tests/integration/test-comparison-scripts.sh
          bash tests/integration/test-pr-reporting-scripts.sh
          bash tests/integration/test-published-cli.sh
          bash tests/integration/test-pr-regression-e2e.sh
      - name: Generate deterministic release artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/prepare-release.py \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --output-directory release-readiness
      - name: Record Marketplace metadata validation
        id: marketplace-metadata
        continue-on-error: true
        run: python3 scripts/validate-distribution.py --output release-readiness/marketplace-readiness.json
      - name: Verify required workflow results for the release commit
        id: required-runs
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: >-
          python3 scripts/check-required-runs.py
          --repository "${{ github.repository }}"
          --commit "$RELEASE_COMMIT"
          --output release-readiness/required-workflow-results.json
      - name: Inspect repository publication prerequisites
        id: repository-settings
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/check-repository-settings.py
          --repository "${{ github.repository }}"
          --immutable-releases-confirmed "${{ inputs.immutable_releases_enabled }}"
          --output release-readiness/repository-settings.json
      - name: Upload release-readiness evidence
        if: ${{ always() && hashFiles('release-readiness/*') != '' }}
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-readiness-${{ inputs.version }}
          path: release-readiness
          if-no-files-found: error
          retention-days: 14
      - name: Enforce repository prerequisites
        if: ${{ steps.repository-settings.outcome != 'success' || steps.marketplace-metadata.outcome != 'success' || steps.required-runs.outcome != 'success' }}
        run: |
          echo "::error title=Release is not eligible::Enable immutable releases and protect main before publication."
          exit 1
