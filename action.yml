name: Complexity Analysis
description: Analyze C# complexity with quality gates, JSON/SARIF reports, and proven regression detection.
author: Rodrigo de Oliveira

branding:
  icon: activity
  color: purple

inputs:
  path:
    description: Path to a .csproj, .sln, or .slnx file within the workspace.
    required: true
  tool-version:
    description: Exact published ComplexityAnalysis.Tool package version to install.
    required: false
    default: 1.0.1
  output-directory:
    description: Directory within the workspace where JSON and SARIF reports will be written.
    required: false
    default: complexity-analysis-reports
  include-generated:
    description: Include generated C# source files in the analysis.
    required: false
    default: "false"
  detect-duplicates:
    description: Enable normalized duplicate-code detection.
    required: false
    default: "false"
  max-complexity:
    description: Maximum Big-O classification. Empty disables this quality gate.
    required: false
    default: ""
  max-cyclomatic-complexity:
    description: Maximum cyclomatic complexity. Empty disables this quality gate.
    required: false
    default: ""
  max-cognitive-complexity:
    description: Maximum cognitive complexity. Empty disables this quality gate.
    required: false
    default: ""
  max-nesting-depth:
    description: Maximum nesting depth. Empty disables this quality gate.
    required: false
    default: ""
  max-method-nloc:
    description: Maximum method NLOC. Empty disables this quality gate.
    required: false
    default: ""
  max-duplicate-rate:
    description: Maximum duplicate rate percentage. Empty disables this quality gate and enables duplicate detection when set.
    required: false
    default: ""
  fail-on-quality-gate:
    description: Fail the Action when a configured quality gate fails.
    required: false
    default: "true"
  upload-sarif:
    description: Upload the generated SARIF report to GitHub Code Scanning.
    required: false
    default: "false"
  compare-with-base:
    description: Generate snapshots and compare the current revision with the PR base or base-ref.
    required: false
    default: "false"
  base-ref:
    description: Optional explicit Git commit or ref to use instead of the pull request base revision.
    required: false
    default: ""
  fail-on-regression:
    description: Fail the Action when the CLI reports one or more proven regressions.
    required: false
    default: "false"
  baseline-path:
    description: Optional existing complexity snapshot JSON to use instead of generating a baseline revision snapshot.
    required: false
    default: ""
  comparison-output:
    description: Optional comparison JSON path within the workspace. Defaults to comparison.json in output-directory.
    required: false
    default: ""
  comment-on-pr:
    description: "Publish or update one bot-authored Pull Request summary. Requires pull-requests: write."
    required: false
    default: "false"

outputs:
  report-path:
    description: Absolute path to the generated JSON report.
    value: ${{ steps.validate.outputs.report-path }}
  sarif-path:
    description: Absolute path to the generated SARIF 2.1.0 report.
    value: ${{ steps.validate.outputs.sarif-path }}
  analysis-status:
    description: Analysis execution result (success, failed, or canceled).
    value: ${{ steps.analyze.outputs.analysis-status }}
  quality-gate-status:
    description: Quality-gate result (not-configured, passed, failed, or unknown).
    value: ${{ steps.analyze.outputs.quality-gate-status }}
  tool-version:
    description: Exact ComplexityAnalysis.Tool version used by the Action.
    value: ${{ steps.validate.outputs.tool-version }}
  baseline-report-path:
    description: Absolute path reserved for the preserved baseline snapshot.
    value: ${{ steps.validate.outputs.baseline-report-path }}
  current-report-path:
    description: Absolute path reserved for the current revision snapshot.
    value: ${{ steps.validate.outputs.current-report-path }}
  comparison-report-path:
    description: Absolute path reserved for the JSON comparison report.
    value: ${{ steps.validate.outputs.comparison-report-path }}
  regression-count:
    description: Number of proven regression findings; zero when comparison was not completed.
    value: ${{ steps.compare.outputs.regression-count }}
  comparison-status:
    description: Comparison result (not-requested, no-regressions, regressions-detected, unavailable, or failed).
    value: ${{ steps.compare.outputs.comparison-status }}
  pr-report-path:
    description: Absolute path to the validated structured Pull Request report; populated after a completed PR comparison.
    value: ${{ steps.validate.outputs.pr-report-path }}

runs:
  using: composite
  steps:
    - name: Validate runner and inputs
      id: validate
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_TOOL_VERSION: ${{ inputs.tool-version }}
        INPUT_OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
        INPUT_INCLUDE_GENERATED: ${{ inputs.include-generated }}
        INPUT_DETECT_DUPLICATES: ${{ inputs.detect-duplicates }}
        INPUT_MAX_COMPLEXITY: ${{ inputs.max-complexity }}
        INPUT_MAX_CYCLOMATIC_COMPLEXITY: ${{ inputs.max-cyclomatic-complexity }}
        INPUT_MAX_COGNITIVE_COMPLEXITY: ${{ inputs.max-cognitive-complexity }}
        INPUT_MAX_NESTING_DEPTH: ${{ inputs.max-nesting-depth }}
        INPUT_MAX_METHOD_NLOC: ${{ inputs.max-method-nloc }}
        INPUT_MAX_DUPLICATE_RATE: ${{ inputs.max-duplicate-rate }}
        INPUT_FAIL_ON_QUALITY_GATE: ${{ inputs.fail-on-quality-gate }}
        INPUT_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        INPUT_COMPARE_WITH_BASE: ${{ inputs.compare-with-base }}
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        INPUT_FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
        INPUT_BASELINE_PATH: ${{ inputs.baseline-path }}
        INPUT_COMPARISON_OUTPUT: ${{ inputs.comparison-output }}
        INPUT_COMMENT_ON_PR: ${{ inputs.comment-on-pr }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
      run: '"$ACTION_PATH/scripts/validate-inputs.sh"'

    - name: Set up .NET 10
      # setup-dotnet v6.0.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: 10.0.403

    - name: Install Complexity Analysis CLI
      id: install
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        NUGET_CONFIG: ${{ github.action_path }}/nuget.config
        TOOL_VERSION: ${{ steps.validate.outputs.tool-version }}
      run: '"$ACTION_PATH/scripts/install-tool.sh"'

    - name: Run complexity analysis
      id: analyze
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ANALYSIS_PATH: ${{ steps.validate.outputs.analysis-path }}
        ANALYSIS_RELATIVE_PATH: ${{ steps.validate.outputs.analysis-relative-path }}
        OUTPUT_RELATIVE_PATH: ${{ steps.validate.outputs.output-relative-path }}
        REPORT_PATH: ${{ steps.validate.outputs.report-path }}
        SARIF_PATH: ${{ steps.validate.outputs.sarif-path }}
        WORKSPACE: ${{ github.workspace }}
        INCLUDE_GENERATED: ${{ inputs.include-generated }}
        DETECT_DUPLICATES: ${{ inputs.detect-duplicates }}
        MAX_COMPLEXITY: ${{ inputs.max-complexity }}
        MAX_CYCLOMATIC_COMPLEXITY: ${{ inputs.max-cyclomatic-complexity }}
        MAX_COGNITIVE_COMPLEXITY: ${{ inputs.max-cognitive-complexity }}
        MAX_NESTING_DEPTH: ${{ inputs.max-nesting-depth }}
        MAX_METHOD_NLOC: ${{ inputs.max-method-nloc }}
        MAX_DUPLICATE_RATE: ${{ inputs.max-duplicate-rate }}
        HAS_THRESHOLDS: ${{ steps.validate.outputs.has-thresholds }}
        TOOL_COMMAND: ${{ steps.install.outputs.tool-command }}
        RUNNER_TEMP: ${{ runner.temp }}
      run: '"$ACTION_PATH/scripts/run-analysis.sh"'

    - name: Compare with baseline
      id: compare
      if: ${{ always() && steps.validate.outcome == 'success' && steps.install.outcome == 'success' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        WORKSPACE: ${{ github.workspace }}
        RUNNER_TEMP: ${{ runner.temp }}
        TOOL_COMMAND: ${{ steps.install.outputs.tool-command }}
        ANALYSIS_STATUS: ${{ steps.analyze.outputs.analysis-status }}
        ANALYSIS_RELATIVE_PATH: ${{ steps.validate.outputs.analysis-relative-path }}
        COMPARISON_REQUESTED: ${{ steps.validate.outputs.comparison-requested }}
        BASELINE_INPUT_PATH: ${{ steps.validate.outputs.baseline-input-path }}
        BASELINE_REPORT_PATH: ${{ steps.validate.outputs.baseline-report-path }}
        CURRENT_REPORT_PATH: ${{ steps.validate.outputs.current-report-path }}
        COMPARISON_REPORT_PATH: ${{ steps.validate.outputs.comparison-report-path }}
        COMPARISON_SARIF_PATH: ${{ steps.validate.outputs.comparison-sarif-path }}
        BASE_REF: ${{ inputs.base-ref }}
        INCLUDE_GENERATED: ${{ inputs.include-generated }}
        DETECT_DUPLICATES: ${{ inputs.detect-duplicates }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: '"$ACTION_PATH/scripts/run-comparison.sh"'

    - name: Build validated Pull Request report
      id: pr-report
      if: ${{ always() && github.event_name == 'pull_request' && (steps.compare.outputs.comparison-status == 'no-regressions' || steps.compare.outputs.comparison-status == 'regressions-detected') }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        WORKSPACE: ${{ github.workspace }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_WORKFLOW: ${{ github.workflow }}
        ANALYSIS_RELATIVE_PATH: ${{ steps.validate.outputs.analysis-relative-path }}
        REPORT_PATH: ${{ steps.validate.outputs.report-path }}
        SARIF_PATH: ${{ steps.validate.outputs.sarif-path }}
        BASELINE_REPORT_PATH: ${{ steps.validate.outputs.baseline-report-path }}
        CURRENT_REPORT_PATH: ${{ steps.validate.outputs.current-report-path }}
        COMPARISON_REPORT_PATH: ${{ steps.validate.outputs.comparison-report-path }}
        PR_REPORT_PATH: ${{ steps.validate.outputs.pr-report-path }}
        COMPARISON_STATUS: ${{ steps.compare.outputs.comparison-status }}
        REGRESSION_COUNT: ${{ steps.compare.outputs.regression-count }}
        QUALITY_GATE_STATUS: ${{ steps.analyze.outputs.quality-gate-status }}
        BASE_REVISION: ${{ steps.compare.outputs.base-revision }}
        BASE_REVISION_KIND: ${{ steps.compare.outputs.base-revision-kind }}
      run: 'python3 "$ACTION_PATH/scripts/build-pr-report.py"'

    - name: Publish Pull Request report
      id: publish-pr-report
      if: ${{ always() && inputs.comment-on-pr == 'true' && steps.pr-report.outcome == 'success' }}
      continue-on-error: true
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PR_REPORT_PATH: ${{ steps.validate.outputs.pr-report-path }}
        EXPECTED_REPOSITORY: ${{ github.repository }}
        EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        EXPECTED_PR_NUMBER: ${{ github.event.pull_request.number }}
        EXPECTED_RUN_ID: ${{ github.run_id }}
        EXPECTED_WORKFLOW_NAME: ${{ github.workflow }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_TOKEN: ${{ github.token }}
      run: 'python3 "$ACTION_PATH/scripts/publish-pr-comment.py"'

    - name: Explain Pull Request publication failure
      if: ${{ always() && inputs.comment-on-pr == 'true' && steps.publish-pr-report.outcome == 'failure' }}
      shell: bash
      run: >-
        echo "::warning title=Pull Request comment not published::The validated report remains available, but GitHub did not permit publication. Grant only 'pull-requests: write' to a trusted publishing job; fork pull_request tokens are normally read-only."

    - name: Validate SARIF for Code Scanning
      id: validate-sarif
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.analyze.outputs.sarif-valid == 'true' }}
      shell: bash
      env:
        SARIF_PATH: ${{ steps.validate.outputs.sarif-path }}
        WORKSPACE: ${{ github.workspace }}
      run: >-
        python3 "${{ github.action_path }}/scripts/validate-report.py"
        sarif "$SARIF_PATH" --workspace "$WORKSPACE" --code-scanning

    - name: Upload SARIF to GitHub Code Scanning
      id: upload-sarif
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.validate-sarif.outcome == 'success' }}
      continue-on-error: true
      # github/codeql-action v4.39.1
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
      with:
        sarif_file: ${{ steps.validate.outputs.sarif-path }}
        checkout_path: ${{ github.workspace }}
        category: complexity-analysis

    - name: Explain SARIF upload failure
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.upload-sarif.outcome == 'failure' }}
      shell: bash
      run: >-
        echo "::error title=Complexity Analysis SARIF upload failed::GitHub Code Scanning rejected the upload. Grant only 'contents: read' and 'security-events: write', and confirm Code Scanning is available for this repository. See the upload step for the server response."

    - name: Write Job Summary
      if: ${{ always() && steps.analyze.outcome != 'skipped' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ANALYSIS_PATH: ${{ steps.validate.outputs.analysis-path }}
        REPORT_PATH: ${{ steps.validate.outputs.report-path }}
        SARIF_PATH: ${{ steps.validate.outputs.sarif-path }}
        TOOL_VERSION: ${{ steps.validate.outputs.tool-version }}
        ANALYSIS_STATUS: ${{ steps.analyze.outputs.analysis-status }}
        QUALITY_GATE_STATUS: ${{ steps.analyze.outputs.quality-gate-status }}
        ANALYSIS_EXIT_CODE: ${{ steps.analyze.outputs.analysis-exit-code }}
        FAIL_ON_QUALITY_GATE: ${{ inputs.fail-on-quality-gate }}
        UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        UPLOAD_OUTCOME: ${{ steps.upload-sarif.outcome }}
        SARIF_VALIDATION_OUTCOME: ${{ steps.validate-sarif.outcome }}
        MAX_COMPLEXITY: ${{ inputs.max-complexity }}
        MAX_CYCLOMATIC_COMPLEXITY: ${{ inputs.max-cyclomatic-complexity }}
        MAX_COGNITIVE_COMPLEXITY: ${{ inputs.max-cognitive-complexity }}
        MAX_NESTING_DEPTH: ${{ inputs.max-nesting-depth }}
        MAX_METHOD_NLOC: ${{ inputs.max-method-nloc }}
        MAX_DUPLICATE_RATE: ${{ inputs.max-duplicate-rate }}
        WORKSPACE: ${{ github.workspace }}
        COMPARISON_STATUS: ${{ steps.compare.outputs.comparison-status }}
        REGRESSION_COUNT: ${{ steps.compare.outputs.regression-count }}
        BASELINE_REPORT_PATH: ${{ steps.validate.outputs.baseline-report-path }}
        CURRENT_REPORT_PATH: ${{ steps.validate.outputs.current-report-path }}
        COMPARISON_REPORT_PATH: ${{ steps.validate.outputs.comparison-report-path }}
        FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
        BASE_REVISION: ${{ steps.compare.outputs.base-revision }}
        BASE_REVISION_KIND: ${{ steps.compare.outputs.base-revision-kind }}
        HEAD_REVISION: ${{ steps.compare.outputs.head-revision }}
        PR_REPORT_PATH: ${{ steps.validate.outputs.pr-report-path }}
        PR_REPORT_OUTCOME: ${{ steps.pr-report.outcome }}
        COMMENT_ON_PR: ${{ inputs.comment-on-pr }}
        COMMENT_OUTCOME: ${{ steps.publish-pr-report.outcome }}
      run: 'python3 "$ACTION_PATH/scripts/write-summary.py"'

    - name: Apply analysis result
      if: ${{ always() && steps.analyze.outcome != 'skipped' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ANALYSIS_EXIT_CODE: ${{ steps.analyze.outputs.analysis-exit-code }}
        FAIL_ON_QUALITY_GATE: ${{ inputs.fail-on-quality-gate }}
        UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        SARIF_VALIDATION_OUTCOME: ${{ steps.validate-sarif.outcome }}
        SARIF_UPLOAD_OUTCOME: ${{ steps.upload-sarif.outcome }}
        COMPARISON_REQUESTED: ${{ steps.validate.outputs.comparison-requested }}
        COMPARISON_STATUS: ${{ steps.compare.outputs.comparison-status }}
        FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
      run: '"$ACTION_PATH/scripts/apply-result.sh"'

    - name: Remove installed CLI
      if: ${{ always() && steps.install.outputs.tool-directory != '' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TOOL_DIRECTORY: ${{ steps.install.outputs.tool-directory }}
        RUNNER_TEMP: ${{ runner.temp }}
      run: '"$ACTION_PATH/scripts/cleanup-tool.sh"'
